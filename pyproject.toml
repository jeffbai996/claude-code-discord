[project]
name = "claude-code-discord"
version = "0.0.1"
description = "Pipe your Claude Code session into Discord — watch it work, see the diffs, approve tools from your phone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "claude-code-discord contributors" }]
keywords = ["claude-code", "discord", "hooks", "observability", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Kept intentionally minimal — hooks talk to Discord over the REST API via
    # stdlib urllib where possible. Add httpx only if the bot side needs it.
]

[project.scripts]
claude-code-discord = "claude_code_discord.cli:main"

[project.urls]
Homepage = "https://github.com/jeffbai996/claude-code-discord"
Issues = "https://github.com/jeffbai996/claude-code-discord/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_discord"]
